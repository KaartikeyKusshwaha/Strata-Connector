[project]
name = "strata-connector"
version = "1.1.1"
description = "Strata Toolkit — Blender add-on, local MCP connector, versioned data contracts, and reference engine for AI-native Minecraft world production."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{name = "Kaartik Kusshwaha"}]
dependencies = [
    "mcp[cli]>=1.3.0,<2",
    "pydantic>=2.0.0,<3",
    "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["addon*", "connector_mcp*", "contracts*", "reference_engine*", "installer*"]

[tool.pytest.ini_options]
markers = [
    "integration: opt-in tests that require a running local or managed Engine",
]

[project.scripts]
strata-mcp = "connector_mcp.server:main"
