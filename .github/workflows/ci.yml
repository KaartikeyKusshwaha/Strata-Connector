# Strata Connector CI Pipeline
# Runs: unit tests, plugin validation, security tests, blender headless,
# e2e tests, release audit, and MCP tool discovery

name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run connector tests
        run: python -m pytest tests/connector -q --basetemp=test-tmp --tb=short

      - name: Run installer tests
        run: python -m pytest tests/installer -q --basetemp=test-tmp --tb=short

      - name: Run Blender headless tests (synthetic)
        run: python -m pytest tests/blender -q --basetemp=test-tmp --tb=short

  plugin-validation:
    name: Plugin Package Validation
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate plugin.json schema
        run: |
          python -c "
          import json, sys
          required_fields = ['name', 'version', 'interface']
          interface_fields = ['composerIcon', 'shortDescription', 'longDescription', 'developerName', 'category', 'capabilities', 'defaultPrompt']
          for path in ['codex_plugin/plugin.json', 'codex_plugin/.codex-plugin/plugin.json']:
              with open(path) as f:
                  data = json.load(f)
              for field in required_fields:
                  assert field in data, f'{path}: missing {field}'
              iface = data.get('interface', {})
              for field in interface_fields:
                  assert field in iface, f'{path}: missing interface.{field}'
              print(f'{path}: VALID')
          print('Plugin validation PASSED')
          "

      - name: Validate icon
        run: |
          python -c "
          from pathlib import Path
          icon = Path('codex_plugin/assets/icon.png')
          assert icon.exists(), 'Icon not found'
          size = icon.stat().st_size
          assert size > 1000, f'Icon too small ({size} bytes)'
          print(f'Icon: {size} bytes, OK')
          "

      - name: Run plugin package tests
        run: python -m pytest tests/connector/test_plugin_package.py -q --tb=short

  mcp-tool-discovery:
    name: MCP Tool Discovery
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify MCP tool registration
        run: python -c "from connector_mcp.server import mcp; tools = mcp._tool_manager.list_tools(); print(f'{len(tools)} tools registered'); assert len(tools) >= 12"

  release-audit:
    name: Release Audit
    runs-on: windows-latest
    needs: [test, plugin-validation]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run release audit
        env:
          # CI validates packaging with an ephemeral key. Production release
          # publishing must use the owner-managed signing secret separately.
          STRATA_RELEASE_SIGNING_SECRET: ci-${{ github.run_id }}-${{ github.sha }}
        run: |
          if (Test-Path ".\scripts\release_audit.ps1") {
            powershell -ExecutionPolicy Bypass -File .\scripts\release_audit.ps1 -StagingDir .
          } else {
            Write-Host "release_audit.ps1 not found - running build_release_package.py"
            python scripts/build_release_package.py
          }
